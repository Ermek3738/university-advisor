<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Sana Admin</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root {
  --bg:         #0f1117;
  --surface:    #1a1d27;
  --surface-2:  #232633;
  --border:     #2a2d3e;
  --accent:     #4f8ef7;
  --accent-dim: rgba(79,142,247,0.14);
  --text:       #e8eaf6;
  --text-muted: #8b8fa8;
  --text-dim:   #5d6178;
  --green:      #10b981;
  --orange:     #f59e0b;
  --red:        #ef4444;
  --green-dim:  rgba(16,185,129,0.14);
  --orange-dim: rgba(245,158,11,0.14);
  --red-dim:    rgba(239,68,68,0.14);
  --shadow-drawer: -20px 0 40px rgba(0,0,0,0.4);
  --shadow-toast: 0 8px 30px rgba(0,0,0,0.3);
  --scrollbar-thumb: var(--border);
  --scrollbar-thumb-hover: #3a3e54;
}
.light {
  --bg:         #f8fafc;
  --surface:    #ffffff;
  --surface-2:  #f1f5f9;
  --border:     #e2e8f0;
  --accent:     #2563eb;
  --accent-dim: rgba(37,99,235,0.08);
  --text:       #0f172a;
  --text-muted: #64748b;
  --text-dim:   #94a3b8;
  --green:      #059669;
  --orange:     #d97706;
  --red:        #dc2626;
  --green-dim:  rgba(5,150,105,0.10);
  --orange-dim: rgba(217,119,6,0.10);
  --red-dim:    rgba(220,38,38,0.08);
  --shadow-drawer: -20px 0 40px rgba(15,23,42,0.12);
  --shadow-toast: 0 8px 30px rgba(15,23,42,0.10);
  --scrollbar-thumb: #cbd5e1;
  --scrollbar-thumb-hover: #94a3b8;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family:'Inter', sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:13px;
  display:flex; flex-direction:column;
  overflow:hidden;
  transition:background 0.2s, color 0.2s;
}
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--scrollbar-thumb-hover); }
button { font-family:inherit; cursor:pointer; }
input, select, textarea { font-family:inherit; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }

/* ── Header ────────────────────────────────────────────────────── */
header {
  height:54px; flex-shrink:0;
  display:flex; align-items:center;
  padding:0 20px; gap:14px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; letter-spacing:-0.2px; }
.brand img { width:30px; height:30px; border-radius:7px; object-fit:cover; }
.brand .tag {
  font-size:10px; font-weight:600;
  padding:2px 8px; border-radius:4px;
  background:var(--accent-dim); color:var(--accent);
  letter-spacing:0.5px; text-transform:uppercase;
}
.header-stats { margin-left:auto; display:flex; align-items:center; gap:14px; }
.stat-pill {
  display:flex; align-items:center; gap:6px;
  padding:5px 12px; border-radius:20px;
  background:var(--surface-2);
  font-size:12px; color:var(--text-muted);
}
.stat-pill strong { color:var(--text); font-weight:600; }
.stat-pill .complete-pct { color:var(--green); font-weight:600; }
.chat-link {
  display:flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:7px;
  background:transparent; border:1px solid var(--border);
  color:var(--text-muted); font-size:12px; font-weight:500;
  text-decoration:none;
  transition:background 0.15s, color 0.15s;
}
.chat-link:hover { background:var(--surface-2); color:var(--text); text-decoration:none; }

/* ── Layout ────────────────────────────────────────────────────── */
.main { flex:1; display:flex; overflow:hidden; }

/* ── Sidebar ───────────────────────────────────────────────────── */
.sidebar {
  width:240px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.sidebar-header { padding:12px 14px; border-bottom:1px solid var(--border); }
.sidebar-title {
  font-size:10px; font-weight:700; letter-spacing:1px;
  color:var(--text-dim); text-transform:uppercase;
  margin-bottom:8px;
}
.search-wrap { position:relative; }
.search-wrap i { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:14px; pointer-events:none; }
.search-input {
  width:100%; padding:7px 10px 7px 30px;
  background:var(--bg); border:1px solid var(--border);
  border-radius:6px; color:var(--text);
  font-size:12px; outline:none;
  transition:border-color 0.15s;
}
.search-input:focus { border-color:var(--accent); }
.search-input::placeholder { color:var(--text-dim); }

.country-list { flex:1; overflow-y:auto; padding:8px; }
.country-item {
  padding:9px 11px; margin-bottom:2px;
  border-radius:6px; cursor:pointer;
  border:1px solid transparent;
  transition:background 0.12s, border-color 0.12s;
}
.country-item:hover { background:var(--surface-2); }
.country-item.active { background:var(--accent-dim); border-color:rgba(79,142,247,0.30); }
.country-row {
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:4px;
}
.country-name { font-size:12.5px; font-weight:500; color:var(--text); }
.country-item.active .country-name { color:var(--accent); font-weight:600; }
.country-count { font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.country-bar { height:3px; background:var(--bg); border-radius:2px; overflow:hidden; position:relative; }
.country-bar-fill { height:100%; background:var(--green); border-radius:2px; transition:width 0.3s; }
.country-bar-pct { font-size:10px; color:var(--text-dim); margin-top:3px; font-variant-numeric:tabular-nums; }

.sidebar-footer { padding:10px 12px; border-top:1px solid var(--border); }
.add-country-btn {
  width:100%; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 10px; border-radius:6px;
  background:transparent; border:1px dashed var(--border);
  color:var(--text-muted); font-size:12px; font-weight:500;
  transition:border-color 0.15s, color 0.15s, background 0.15s;
}
.add-country-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
.add-country-input {
  width:100%; padding:8px 10px;
  background:var(--bg); border:1px solid var(--accent);
  border-radius:6px; color:var(--text);
  font-size:12px; outline:none;
}

/* ── Main panel ────────────────────────────────────────────────── */
.panel { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
.panel-header {
  padding:14px 22px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px;
  background:var(--surface);
  flex-wrap:wrap;
}
.panel-title { font-size:15px; font-weight:600; letter-spacing:-0.2px; flex:1; }
.panel-title .subdued { color:var(--text-muted); font-weight:500; }
.panel-actions { display:flex; align-items:center; gap:10px; }
.btn-primary {
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:7px;
  background:var(--accent); color:#fff;
  border:none; font-size:12.5px; font-weight:600;
  transition:opacity 0.15s, transform 0.08s;
}
.btn-primary:hover { opacity:0.9; }
.btn-primary:active { transform:scale(0.98); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
.btn-ghost {
  display:flex; align-items:center; gap:6px;
  padding:7px 12px; border-radius:7px;
  background:transparent; border:1px solid var(--border);
  color:var(--text-muted); font-size:12px; font-weight:500;
  transition:background 0.15s, color 0.15s;
}
.btn-ghost:hover { background:var(--surface-2); color:var(--text); }
.search-panel { position:relative; min-width:220px; }
.search-panel i { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:14px; }
.search-panel input {
  width:100%; padding:8px 10px 8px 30px;
  background:var(--bg); border:1px solid var(--border);
  border-radius:7px; color:var(--text);
  font-size:12.5px; outline:none;
  transition:border-color 0.15s;
}
.search-panel input:focus { border-color:var(--accent); }

.uni-list { flex:1; overflow-y:auto; padding:18px 22px; }
.uni-list-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; color:var(--text-muted); gap:6px;
}
.uni-list-empty i { font-size:34px; color:var(--text-dim); }
.uni-list-empty h3 { font-size:14px; font-weight:500; color:var(--text); }
.uni-list-empty p { font-size:12px; }

/* ── University card ───────────────────────────────────────────── */
.uni-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:10px;
  position:relative;
  transition:border-color 0.15s, transform 0.3s, opacity 0.3s;
}
.uni-card:hover { border-color:#3a3e54; }
.uni-card.fading { opacity:0; transform:translateX(20px); }
.uni-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.uni-card-title { flex:1; min-width:0; }
.uni-name {
  font-size:14.5px; font-weight:600; color:var(--text);
  letter-spacing:-0.2px; margin-bottom:3px;
  display:flex; align-items:center; gap:6px;
  flex-wrap:wrap;
}
.uni-name .warn-flag { color:var(--orange); font-size:14px; }
.country-badge {
  display:inline-flex; align-items:center; gap:3px;
  padding:1px 7px; border-radius:10px;
  background:var(--surface-2);
  font-size:10px; font-weight:600; letter-spacing:0.3px;
  color:var(--text-muted); text-transform:uppercase;
}
.uni-sub { font-size:12px; color:var(--text-muted); display:flex; gap:8px; flex-wrap:wrap; }
.uni-sub .sep { color:var(--text-dim); }
.uni-stats {
  display:flex; gap:14px; margin-top:8px;
  font-size:12px; color:var(--text-muted);
  font-variant-numeric:tabular-nums;
  flex-wrap:wrap;
}
.uni-stats .label { color:var(--text-dim); margin-right:3px; }
.uni-stats .val { color:var(--text); font-weight:500; }
.uni-meta { margin-top:8px; font-size:11.5px; color:var(--text-muted); }
.uni-meta .row { margin-top:3px; }
.uni-meta .key { color:var(--text-dim); text-transform:uppercase; font-size:9.5px; font-weight:700; letter-spacing:0.6px; margin-right:5px; }
.uni-actions {
  display:flex; gap:4px; flex-shrink:0;
}
.icon-btn {
  width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid var(--border);
  border-radius:6px; color:var(--text-muted);
  transition:background 0.15s, color 0.15s, border-color 0.15s;
}
.icon-btn:hover { background:var(--surface-2); color:var(--text); }
.icon-btn.danger:hover { background:var(--red-dim); color:var(--red); border-color:rgba(239,68,68,0.3); }

.scholarship-badge {
  display:inline-flex; align-items:center; gap:3px;
  padding:2px 8px; border-radius:10px;
  font-size:10px; font-weight:600; letter-spacing:0.4px;
  text-transform:uppercase;
}
.s-yes { background:var(--green-dim); color:var(--green); }
.s-partial { background:var(--orange-dim); color:var(--orange); }
.s-no { background:var(--surface-2); color:var(--text-muted); }
.s-missing { background:var(--red-dim); color:var(--red); }

.warn-banner {
  margin-top:10px; padding:7px 10px; border-radius:6px;
  background:var(--orange-dim); border:1px solid rgba(245,158,11,0.25);
  color:var(--orange); font-size:11.5px; font-weight:500;
  display:flex; align-items:center; gap:6px;
}

.delete-confirm {
  background:var(--red-dim); border:1px solid rgba(239,68,68,0.3);
  color:var(--text);
  padding:14px 16px; border-radius:10px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:10px;
  font-size:13px;
}
.delete-confirm-actions { display:flex; gap:8px; }
.btn-danger {
  padding:6px 12px; border-radius:6px;
  background:var(--red); color:#fff; border:none;
  font-size:11.5px; font-weight:600;
  transition:opacity 0.15s;
}
.btn-danger:hover { opacity:0.88; }

/* ── Drawer ────────────────────────────────────────────────────── */
.drawer-backdrop {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.55);
  opacity:0; pointer-events:none;
  transition:opacity 0.2s;
  z-index:50;
}
.drawer-backdrop.open { opacity:1; pointer-events:auto; }
.drawer {
  position:fixed; top:0; right:0; bottom:0; width:480px; max-width:95vw;
  background:var(--surface);
  border-left:1px solid var(--border);
  transform:translateX(100%);
  transition:transform 0.25s ease;
  z-index:60;
  display:flex; flex-direction:column;
  box-shadow:var(--shadow-drawer);
}
.drawer.open { transform:translateX(0); }
.drawer-head {
  padding:16px 20px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
.drawer-title { font-size:15px; font-weight:600; }
.drawer-body { flex:1; overflow-y:auto; padding:18px 20px; }
.drawer-foot {
  padding:14px 20px; border-top:1px solid var(--border);
  display:flex; gap:10px; justify-content:flex-end;
  flex-shrink:0;
  background:var(--surface);
}

.field-section {
  font-size:10px; font-weight:700; letter-spacing:1.2px;
  color:var(--text-dim); text-transform:uppercase;
  margin:14px 0 8px; padding-bottom:5px;
  border-bottom:1px solid var(--border);
}
.field-section:first-child { margin-top:0; }
.field { margin-bottom:11px; }
.field label {
  display:block; font-size:11px; font-weight:500;
  color:var(--text-muted); margin-bottom:4px;
}
.field label .required { color:var(--red); }
.field input,
.field select,
.field textarea {
  width:100%; padding:8px 10px;
  background:var(--bg); border:1px solid var(--border);
  border-radius:6px; color:var(--text);
  font-size:12.5px; outline:none;
  transition:border-color 0.15s;
  font-family:inherit;
}
.field input:focus,
.field select:focus,
.field textarea:focus { border-color:var(--accent); }
.field input::placeholder, .field textarea::placeholder { color:var(--text-dim); }
.field textarea { resize:vertical; min-height:48px; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* ── Toasts ────────────────────────────────────────────────────── */
.toast-wrap {
  position:fixed; bottom:20px; right:20px;
  display:flex; flex-direction:column; gap:8px;
  z-index:100;
}
.toast {
  padding:11px 14px 11px 12px;
  border-radius:8px;
  background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; gap:9px;
  font-size:12.5px; color:var(--text);
  min-width:200px; max-width:340px;
  box-shadow:var(--shadow-toast);
  animation:slideIn 0.25s ease;
}
.toast.success { border-color:rgba(16,185,129,0.4); }
.toast.success i { color:var(--green); }
.toast.error { border-color:rgba(239,68,68,0.4); }
.toast.error i { color:var(--red); }
.toast.leaving { animation:slideOut 0.25s ease forwards; }
@keyframes slideIn { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
@keyframes slideOut { to { transform:translateX(120%); opacity:0; } }

/* ── Spinner / loading screen ──────────────────────────────────── */
.loading-screen {
  position:fixed; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg);
  gap:12px; z-index:200;
  transition:opacity 0.2s;
}
.loading-screen.hidden { opacity:0; pointer-events:none; }
.spinner {
  width:34px; height:34px;
  border:3px solid var(--surface-2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
.btn-spinner {
  width:13px; height:13px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  display:inline-block;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { color:var(--text-muted); font-size:13px; }

.error-screen {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; padding:32px; text-align:center; gap:10px;
}
.error-screen i { font-size:42px; color:var(--red); }
.error-screen h2 { font-size:16px; font-weight:600; }
.error-screen p { color:var(--text-muted); font-size:13px; max-width:420px; line-height:1.6; }
.error-screen code {
  background:var(--surface-2); padding:2px 7px; border-radius:4px;
  color:var(--accent); font-size:12px; font-family:'JetBrains Mono', monospace;
}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Loading universities…</div>
</div>

<header>
  <div class="brand">
    <img src="logo.png" alt="logo">
    <span>AI-Sana</span>
    <span class="tag">Admin</span>
  </div>
  <div class="header-stats" id="headerStats"></div>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme" style="width:34px;height:34px;">
    <i class="ti ti-sun" id="themeIcon"></i>
  </button>
  <a class="chat-link" href="index.html"><i class="ti ti-message-circle"></i><span>Chat</span></a>
</header>

<div class="main" id="main">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Countries</div>
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="countrySearch" placeholder="Search countries…">
      </div>
    </div>
    <div class="country-list" id="countryList"></div>
    <div class="sidebar-footer" id="sidebarFooter">
      <button class="add-country-btn" id="addCountryBtn" onclick="showAddCountryInput()">
        <i class="ti ti-plus"></i><span>Add Country</span>
      </button>
    </div>
  </aside>

  <section class="panel">
    <div class="panel-header">
      <h1 class="panel-title" id="panelTitle">All Universities</h1>
      <div class="panel-actions">
        <div class="search-panel">
          <i class="ti ti-search"></i>
          <input id="uniSearch" placeholder="Search universities, programs, notes…">
        </div>
        <button class="btn-primary" onclick="openDrawer(null)">
          <i class="ti ti-plus"></i><span>Add University</span>
        </button>
      </div>
    </div>
    <div class="uni-list" id="uniList"></div>
  </section>
</div>

<!-- Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-title" id="drawerTitle">Add University</span>
    <button class="icon-btn" onclick="closeDrawer()"><i class="ti ti-x"></i></button>
  </div>
  <div class="drawer-body">
    <form id="uniForm" onsubmit="event.preventDefault(); saveDrawer();">
      <div class="field-section">Basic</div>
      <div class="field">
        <label>University Name <span class="required">*</span></label>
        <input id="f_name" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Country</label>
          <input id="f_country" list="countryDatalist" placeholder="Germany">
          <datalist id="countryDatalist"></datalist>
        </div>
        <div class="field">
          <label>City</label>
          <input id="f_city" placeholder="Berlin">
        </div>
      </div>
      <div class="field">
        <label>Website</label>
        <input id="f_website" type="url" placeholder="https://…">
      </div>
      <div class="field">
        <label>QS Ranking</label>
        <input id="f_qs_ranking" type="number" min="1" placeholder="e.g. 201">
      </div>

      <div class="field-section">Tuition</div>
      <div class="field-row">
        <div class="field">
          <label>Min Tuition</label>
          <input id="f_tuition_min" type="number" step="any" placeholder="e.g. 15000">
        </div>
        <div class="field">
          <label>Max Tuition</label>
          <input id="f_tuition_max" type="number" step="any" placeholder="e.g. 20000">
        </div>
      </div>
      <div class="field">
        <label>Currency</label>
        <select id="f_tuition_currency">
          <option value="USD">USD</option>
          <option value="GBP">GBP</option>
          <option value="EUR">EUR</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
          <option value="CHF">CHF</option>
          <option value="SGD">SGD</option>
          <option value="MYR">MYR</option>
          <option value="AED">AED</option>
        </select>
      </div>

      <div class="field-section">Requirements</div>
      <div class="field-row">
        <div class="field">
          <label>IELTS Min</label>
          <input id="f_ielts_min" type="number" step="0.5" min="0" max="9" placeholder="e.g. 6.5">
        </div>
        <div class="field">
          <label>TOEFL Min</label>
          <input id="f_toefl_min" type="number" min="0" max="120" placeholder="e.g. 80">
        </div>
      </div>
      <div class="field">
        <label>GPA Min</label>
        <input id="f_gpa_min" type="number" step="0.1" min="0" max="4" placeholder="e.g. 3.0">
      </div>

      <div class="field-section">Programs &amp; Intakes</div>
      <div class="field">
        <label>Programs</label>
        <textarea id="f_programs" rows="2" placeholder="Computer Science, Business, Law"></textarea>
      </div>
      <div class="field">
        <label>Intakes</label>
        <input id="f_intakes" placeholder="September, January">
      </div>
      <div class="field">
        <label>Application Deadline</label>
        <input id="f_application_deadline" placeholder="March 1 / Rolling">
      </div>

      <div class="field-section">Other</div>
      <div class="field">
        <label>Scholarship</label>
        <select id="f_scholarship_available">
          <option value="">—</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
          <option value="Partial">Partial</option>
        </select>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f_notes" rows="3"></textarea>
      </div>
    </form>
  </div>
  <div class="drawer-foot">
    <button class="btn-ghost" onclick="closeDrawer()">Cancel</button>
    <button class="btn-primary" id="saveBtn" onclick="saveDrawer()"><i class="ti ti-device-floppy"></i><span>Save</span></button>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// TODO: add auth — admin endpoints are open. Wrap fetch() with a token header here.
const API_BASE = 'https://ai-sana-bk23.onrender.com';
const THEME_KEY = 'aisana_admin_theme';

function applyTheme(isDark) {
  document.body.classList.toggle('light', !isDark);
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = isDark ? 'ti ti-sun' : 'ti ti-moon';
}
function toggleTheme() {
  const isDark = !document.body.classList.contains('light');
  const next = !isDark;
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next ? 'dark' : 'light'); } catch {}
}
(function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem(THEME_KEY) || 'dark'; } catch {}
  applyTheme(saved !== 'light');
})();

const state = {
  countries: [],          // [{name, total, complete, universities:[...]}]
  total: 0,
  complete: 0,
  activeCountry: null,    // null => "All", else country name
  countrySearch: '',
  uniSearch: '',
  editing: null,          // id of university being edited, or null for new
};

const REQUIRED = ['tuition_min','ielts_min','gpa_min','programs','intakes'];
const FIELD_LABELS = {
  tuition_min:'tuition', ielts_min:'IELTS', gpa_min:'GPA',
  programs:'programs', intakes:'intakes',
};

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtMoney(n) {
  if (n === null || n === undefined || n === '') return '—';
  return '$' + Math.round(Number(n)).toLocaleString();
}

function isComplete(u) {
  return REQUIRED.every(f => {
    const v = u[f];
    if (v === null || v === undefined) return false;
    if (typeof v === 'string' && !v.trim()) return false;
    return true;
  });
}

function missingFields(u) {
  return REQUIRED.filter(f => {
    const v = u[f];
    if (v === null || v === undefined) return true;
    if (typeof v === 'string' && !v.trim()) return true;
    return false;
  }).map(f => FIELD_LABELS[f]);
}

// ── Data fetch ─────────────────────────────────────────────────
async function loadAll() {
  try {
    const r = await fetch(API_BASE + '/admin/universities');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.countries = data.countries || [];
    state.total = data.total_universities || 0;
    state.complete = data.total_complete || 0;
    renderAll();
    document.getElementById('loadingScreen').classList.add('hidden');
  } catch (err) {
    console.error(err);
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('main').innerHTML = `
      <div class="error-screen">
        <i class="ti ti-plug-connected-x"></i>
        <h2>Cannot connect to backend</h2>
        <p>Failed to reach <code>${API_BASE}</code> — the backend may be sleeping (Render free tier) or offline. Wait ~30s and retry.</p>
        <button class="btn-primary" onclick="location.reload()">Retry</button>
      </div>`;
  }
}

// ── Render ─────────────────────────────────────────────────────
function renderAll() {
  renderHeader();
  renderCountries();
  renderUniversities();
  renderCountryDatalist();
}

function renderHeader() {
  const total = state.total;
  const complete = state.complete;
  const pct = total ? Math.round((complete / total) * 100) : 0;
  document.getElementById('headerStats').innerHTML = `
    <div class="stat-pill"><strong>${total}</strong> universities</div>
    <div class="stat-pill"><strong>${complete}</strong> complete <span class="complete-pct">(${pct}%)</span></div>
  `;
}

function renderCountries() {
  const list = document.getElementById('countryList');
  const q = state.countrySearch.toLowerCase();

  const filtered = state.countries.filter(c => !q || c.name.toLowerCase().includes(q));
  const allPct = state.total ? Math.round((state.complete / state.total) * 100) : 0;

  const items = [];
  items.push(countryItemHtml({ name:'All', total:state.total, complete:state.complete, pct:allPct }, state.activeCountry === null, 'all'));
  filtered.forEach(c => {
    const pct = c.total ? Math.round((c.complete / c.total) * 100) : 0;
    items.push(countryItemHtml(c, state.activeCountry === c.name, c.name));
  });
  list.innerHTML = items.join('');
}

function countryItemHtml(c, active, key) {
  const pct = c.total ? Math.round((c.complete / c.total) * 100) : 0;
  const dataAttr = key === 'all' ? 'data-country-all="1"' : `data-country="${esc(c.name)}"`;
  return `
    <div class="country-item${active?' active':''}" ${dataAttr}>
      <div class="country-row">
        <span class="country-name">${esc(c.name)}</span>
        <span class="country-count">${c.total}</span>
      </div>
      <div class="country-bar"><div class="country-bar-fill" style="width:${pct}%"></div></div>
      <div class="country-bar-pct">${c.complete}/${c.total} complete · ${pct}%</div>
    </div>`;
}

function selectCountry(name) {
  state.activeCountry = name;
  renderCountries();
  renderUniversities();
}

function renderCountryDatalist() {
  const dl = document.getElementById('countryDatalist');
  dl.innerHTML = state.countries.map(c => `<option value="${esc(c.name)}">`).join('');
}

function flattenUniversities() {
  if (state.activeCountry) {
    const c = state.countries.find(x => x.name === state.activeCountry);
    return c ? c.universities.map(u => ({...u, _country: c.name})) : [];
  }
  const out = [];
  state.countries.forEach(c => c.universities.forEach(u => out.push({...u, _country: c.name})));
  return out;
}

function renderUniversities() {
  const title = document.getElementById('panelTitle');
  if (state.activeCountry) {
    const c = state.countries.find(x => x.name === state.activeCountry);
    const total = c ? c.total : 0;
    title.innerHTML = `Universities in <strong>${esc(state.activeCountry)}</strong> <span class="subdued">· ${total}</span>`;
  } else {
    title.innerHTML = `All Universities <span class="subdued">· ${state.total}</span>`;
  }

  let unis = flattenUniversities();
  const q = state.uniSearch.toLowerCase().trim();
  if (q) {
    unis = unis.filter(u => {
      const hay = [u.name, u.city, u.programs, u.notes].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  // incomplete first, then alphabetical
  unis.sort((a, b) => {
    const ca = isComplete(a), cb = isComplete(b);
    if (ca !== cb) return ca ? 1 : -1;
    return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
  });

  const list = document.getElementById('uniList');
  if (!unis.length) {
    list.innerHTML = `
      <div class="uni-list-empty">
        <i class="ti ti-school-off"></i>
        <h3>No universities</h3>
        <p>${q ? 'Nothing matches your search.' : 'Add the first one to get started.'}</p>
      </div>`;
    return;
  }
  list.innerHTML = unis.map(uniCardHtml).join('');
}

function uniCardHtml(u) {
  const complete = isComplete(u);
  const missing = complete ? [] : missingFields(u);

  const tuitionUsd = u.tuition_usd;
  const sch = (u.scholarship_available || '').toLowerCase();
  let schBadge = '';
  if (sch.includes('yes')) schBadge = '<span class="scholarship-badge s-yes">Yes</span>';
  else if (sch.includes('partial')) schBadge = '<span class="scholarship-badge s-partial">Partial</span>';
  else if (sch.includes('no')) schBadge = '<span class="scholarship-badge s-no">No</span>';
  else schBadge = '<span class="scholarship-badge s-missing">⚠ Missing</span>';

  const programs = u.programs ? (u.programs.length > 80 ? u.programs.slice(0, 77) + '…' : u.programs) : '—';
  const cityBits = [];
  if (u.city) cityBits.push(esc(u.city));
  cityBits.push(u.qs_ranking ? `QS #${u.qs_ranking}` : 'QS —');

  const countryBadge = !state.activeCountry && u._country
    ? `<span class="country-badge"><i class="ti ti-map-pin" style="font-size:11px;"></i>${esc(u._country)}</span>`
    : '';

  return `
    <div class="uni-card" data-id="${u.id}">
      <div class="uni-card-head">
        <div class="uni-card-title">
          <div class="uni-name">
            ${!complete ? '<i class="ti ti-alert-triangle warn-flag"></i>' : ''}
            <span>${esc(u.name)}</span>
            ${countryBadge}
          </div>
          <div class="uni-sub">
            <span>${cityBits.join(' <span class="sep">·</span> ')}</span>
          </div>
          <div class="uni-stats">
            <span><span class="label">IELTS</span><span class="val">${u.ielts_min ?? '—'}</span></span>
            <span><span class="label">GPA</span><span class="val">${u.gpa_min ?? '—'}</span></span>
            <span><span class="label">Tuition</span><span class="val">${fmtMoney(tuitionUsd ?? u.tuition_min)}${tuitionUsd ? '/yr' : ''}</span></span>
            <span>${schBadge}</span>
          </div>
          <div class="uni-meta">
            <div class="row"><span class="key">Programs</span>${esc(programs)}</div>
            <div class="row"><span class="key">Intakes</span>${esc(u.intakes || '—')}</div>
          </div>
          ${!complete ? `<div class="warn-banner"><i class="ti ti-alert-triangle"></i>Missing: ${esc(missing.join(', '))}</div>` : ''}
        </div>
        <div class="uni-actions">
          ${u.website ? `<a class="icon-btn" href="${esc(u.website)}" target="_blank" rel="noopener" title="Open website"><i class="ti ti-external-link"></i></a>` : ''}
          <button class="icon-btn" onclick="openDrawer(${u.id})" title="Edit"><i class="ti ti-pencil"></i></button>
          <button class="icon-btn danger" onclick="askDelete(${u.id})" title="Delete"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    </div>`;
}

// ── Delete ─────────────────────────────────────────────────────
function askDelete(id) {
  const card = document.querySelector(`.uni-card[data-id="${id}"]`);
  if (!card) return;
  const uni = flattenUniversities().find(u => u.id === id);
  const name = uni ? uni.name : '#' + id;
  card.outerHTML = `
    <div class="delete-confirm" data-confirm-id="${id}">
      <span>Delete <strong>${esc(name)}</strong>?</span>
      <span class="delete-confirm-actions">
        <button class="btn-ghost" onclick="cancelDelete(${id})">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete(${id})">Delete</button>
      </span>
    </div>`;
}

function cancelDelete(id) {
  renderUniversities();
}

async function confirmDelete(id) {
  const box = document.querySelector(`[data-confirm-id="${id}"]`);
  try {
    const r = await fetch(`${API_BASE}/admin/universities/${id}`, { method:'DELETE' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (box) {
      box.style.transition = 'opacity 0.25s, transform 0.25s';
      box.style.opacity = '0';
      box.style.transform = 'translateX(20px)';
    }
    setTimeout(async () => { await loadAll(); }, 220);
    toast('Deleted', 'success');
  } catch (err) {
    console.error(err);
    toast('Error deleting — check console', 'error');
    renderUniversities();
  }
}

// ── Drawer ─────────────────────────────────────────────────────
function openDrawer(id, prefill = {}) {
  state.editing = id;
  document.getElementById('drawerTitle').textContent = id ? 'Edit University' : 'Add University';
  const fields = ['name','country','city','website','qs_ranking','tuition_min','tuition_max','tuition_currency',
    'ielts_min','toefl_min','gpa_min','programs','intakes','application_deadline','scholarship_available','notes'];
  fields.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (!el) return;
    if (f === 'tuition_currency') el.value = 'USD'; else el.value = '';
  });
  if (id) {
    const u = flattenUniversities().find(x => x.id === id);
    if (u) {
      fields.forEach(f => {
        const el = document.getElementById('f_' + f);
        if (!el) return;
        const v = u[f];
        el.value = (v === null || v === undefined) ? '' : v;
      });
      if (!u.tuition_currency) document.getElementById('f_tuition_currency').value = 'USD';
    }
  }
  Object.entries(prefill).forEach(([k,v]) => {
    const el = document.getElementById('f_' + k);
    if (el) el.value = v;
  });
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('f_name').focus(), 200);
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
  state.editing = null;
}

function collectForm() {
  const get = id => document.getElementById(id).value.trim();
  const num = id => { const v = get(id); return v === '' ? null : Number(v); };
  const intnum = id => { const v = get(id); return v === '' ? null : parseInt(v, 10); };
  const str = id => { const v = get(id); return v === '' ? null : v; };
  return {
    name: get('f_name'),
    country: str('f_country'),
    city: str('f_city'),
    website: str('f_website'),
    qs_ranking: intnum('f_qs_ranking'),
    tuition_min: num('f_tuition_min'),
    tuition_max: num('f_tuition_max'),
    tuition_currency: get('f_tuition_currency') || 'USD',
    ielts_min: num('f_ielts_min'),
    toefl_min: intnum('f_toefl_min'),
    gpa_min: num('f_gpa_min'),
    programs: str('f_programs'),
    intakes: str('f_intakes'),
    application_deadline: str('f_application_deadline'),
    scholarship_available: str('f_scholarship_available'),
    notes: str('f_notes'),
  };
}

async function saveDrawer() {
  const body = collectForm();
  if (!body.name) {
    toast('University name is required', 'error');
    return;
  }
  const btn = document.getElementById('saveBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span><span>Saving…</span>';
  try {
    const isEdit = state.editing !== null;
    const url = isEdit ? `${API_BASE}/admin/universities/${state.editing}` : `${API_BASE}/admin/universities`;
    const r = await fetch(url, {
      method: isEdit ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const saved = await r.json();
    closeDrawer();
    // If the user added a new country, switch the sidebar to that country
    if (!isEdit && saved.country) state.activeCountry = saved.country;
    await loadAll();
    toast('Saved ✓', 'success');
  } catch (err) {
    console.error(err);
    toast('Error saving — check console', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// ── Add Country (just pre-fills the drawer) ────────────────────
function showAddCountryInput() {
  const foot = document.getElementById('sidebarFooter');
  foot.innerHTML = `
    <input class="add-country-input" id="newCountryInput"
      placeholder="Country name, Enter to confirm"
      onkeydown="addCountryKey(event)" onblur="cancelAddCountry()">`;
  setTimeout(() => document.getElementById('newCountryInput').focus(), 0);
}
function addCountryKey(e) {
  if (e.key === 'Enter') {
    const v = e.target.value.trim();
    cancelAddCountry();
    if (v) openDrawer(null, { country: v });
  } else if (e.key === 'Escape') {
    cancelAddCountry();
  }
}
function cancelAddCountry() {
  document.getElementById('sidebarFooter').innerHTML = `
    <button class="add-country-btn" id="addCountryBtn" onclick="showAddCountryInput()">
      <i class="ti ti-plus"></i><span>Add Country</span>
    </button>`;
}

// ── Toast ──────────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const wrap = document.getElementById('toastWrap');
  const div = document.createElement('div');
  div.className = 'toast ' + type;
  div.innerHTML = `<i class="ti ti-${type === 'success' ? 'check' : 'alert-circle'}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(div);
  setTimeout(() => {
    div.classList.add('leaving');
    setTimeout(() => div.remove(), 250);
  }, 3000);
}

// ── Wire up listeners ──────────────────────────────────────────
document.getElementById('countrySearch').addEventListener('input', e => {
  state.countrySearch = e.target.value;
  renderCountries();
});
document.getElementById('countryList').addEventListener('click', e => {
  const item = e.target.closest('.country-item');
  if (!item) return;
  if (item.hasAttribute('data-country-all')) selectCountry(null);
  else selectCountry(item.getAttribute('data-country'));
});
document.getElementById('uniSearch').addEventListener('input', e => {
  state.uniSearch = e.target.value;
  renderUniversities();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
  }
});

loadAll();
</script>
</body>
</html>
